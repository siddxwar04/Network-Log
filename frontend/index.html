<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>netlog</title>
    <script>
      // Apply the saved theme before the page is drawn, so it never flashes the wrong one.
      try {
        if (localStorage.getItem("netlog-theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
