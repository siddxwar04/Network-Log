[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netlog"
version = "0.1.0"
description = "CauseLine: from network logs to root cause, with the lines that prove it"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "drain3>=0.9.11",
    "openai>=3.57",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
netlog = "netlog.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["netlog*"]

[tool.setuptools.package-data]
netlog = ["config/*.toml", "llm/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "generator/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
