<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinpoint logo</title>
<style>
  body { margin: 0; padding: 32px 16px 64px; background: #e9ebf0; color: #14161f;
         font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p { margin: 2px 0 16px; color: #4f5866; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .bg { border-radius: 10px; padding: 24px; }
  .dark { background: #0a0d12; color: #e6eaf0; }
  .light { background: #ffffff; color: #111418; border: 1px solid #dcdfe5; }
  .sizes { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  figure { margin: 0; text-align: center; }
  figcaption { font-size: 11px; opacity: .6; margin-top: 6px; }
  .lockup { display: flex; align-items: center; gap: 10px; margin-top: 24px;
            font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .sizes img { display: block; margin: 0 auto; }
</style>
</head>
<body>
<main>
<h1>Pinpoint logo</h1>
<p>The violet node is the root cause; the three devices it affected hang off it. Shown at 128, 48, 32 and 16 pixels. Violet is #785ef0.</p>
<div class="pair">
  <div class="bg dark">
    <div class="sizes">
      <figure><img src="logo.svg" width="128" height="128" alt=""><figcaption>128</figcaption></figure>
      <figure><img src="logo.svg" width="48" height="48" alt=""><figcaption>48</figcaption></figure>
      <figure><img src="logo.svg" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
      <figure><img src="logo.svg" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
    </div>
    <div class="lockup"><img src="logo.svg" width="40" height="40" alt=""><span>Pinpoint</span></div>
  </div>
  <div class="bg light">
    <div class="sizes">
      <figure><img src="logo.svg" width="128" height="128" alt=""><figcaption>128</figcaption></figure>
      <figure><img src="logo.svg" width="48" height="48" alt=""><figcaption>48</figcaption></figure>
      <figure><img src="logo.svg" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
      <figure><img src="logo.svg" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
    </div>
    <div class="lockup"><img src="logo.svg" width="40" height="40" alt=""><span>Pinpoint</span></div>
  </div>
</div>
</main>
</body>
</html>
